<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found — FlipVid</title>

    <meta
        name="description"
        content="The page you're looking for could not be found. Return to FlipVid and flip or rotate your video online."
    >

    <link rel="icon" href="assets/FlipVid.ico" type="image/x-icon">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        .error-code {
            color: #3b82f6;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 15px;
        }

        p {
            color: #9ca3af;
            font-size: 17px;
            line-height: 1.6;
            margin: 0 auto 30px;
            max-width: 500px;
        }

        .button {
            display: inline-block;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .brand {
            margin-top: 45px;
            color: #6b7280;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            src="assets/FlipVid.ico"
            alt="FlipVid"
            class="logo"
        >

        <div class="error-code">
            ERROR 404
        </div>

        <h1>Page Not Found</h1>

        <p>
            Looks like this page took a wrong turn.
            Let's get you back to FlipVid.
        </p>

        <a href="index.html" class="button">
            Back to FlipVid
        </a>

        <div class="brand">
            © 2026 Pixlmart Utilities · FlipVid
        </div>

    </div>

</body>
</html>
